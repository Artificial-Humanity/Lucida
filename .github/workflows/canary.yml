name: canary

# Deliberately NOT scheduled.
#
# The canary is run by hand, before every release and after changing a provider
# lane. ai-lab-0 is the natural place to run it, for credential geography: the
# provider keys already live on that machine, and putting a second copy into
# GitHub Actions secrets would double the number of places they exist, on
# infrastructure we do not control.
#
# This workflow exists for the other case: running the probes by hand against a
# specific commit, from a machine that is not ai-lab-0. It reads whatever
# provider secrets happen to be configured and skips the rest — but a dispatch
# with NO provider secrets set fails, by design. Every keyed provider is then
# skipped, ComfyUI is skipped too (nothing listens on the runner), and
# `scripts/canary.sh` exits 1 with "NOTHING WAS PROBED": a probe that probed
# nothing must not pass, because a green run would read as "no drift" when no
# question was asked. Set at least one provider secret before dispatching.
on:
  workflow_dispatch:

# The job only reads the repository to build it. The provider keys arrive as
# step-level secrets, not through the token, so the token needs nothing more —
# and a probe script that is handed live credentials should not also be handed
# a token that can write.
permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: cargo build --locked --release

      # Every probe is free by construction: a model list, a balance, or a
      # render request naming a model that cannot exist. See the header of
      # canary.sh — a successful render there is reported as a failure, because
      # it would mean money was spent by a script whose contract is that it
      # spends none.
      - name: Probe the providers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Runway and Kling are lanes in canary.sh like the four above. Left
          # out of this block they were skipped on every run, whether or not the
          # secret existed — the header promises "whatever secrets happen to be
          # configured", and these two were never read.
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          KLINGAI_API_KEY: ${{ secrets.KLINGAI_API_KEY }}
        run: ./scripts/canary.sh target/release/lucida
