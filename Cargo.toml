[package]
name = "lucida"
version = "0.1.0"
edition = "2024"
description = "Generate and edit images via the Google Gemini API — usable as a CLI or as an MCP server"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# rustls rather than native-tls: keeps the binary free of a system OpenSSL
# dependency, so the same source cross-compiles cleanly to the Mac.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
