[package]
name = "lucida"
version = "1.0.1"
edition = "2024"
# Edition 2024 needs 1.85. Stated so cargo refuses with "requires rustc 1.85 or
# newer" rather than handing an older toolchain a wall of syntax errors — which
# is what `cargo install --git`, the update path for anyone who did not take a
# release binary, does today.
rust-version = "1.85"
description = "Generate images and video with Google Gemini, Veo, Runway, Kling, a local ComfyUI, FLUX, Stability AI or OpenAI — a CLI and an MCP server"
license = "Apache-2.0"

# Everything below is what crates.io renders on the package page. Absent, the
# listing has a description and nothing else — no link to the source, and no
# category or keyword anyone could find it under. Cargo does not warn about it,
# because none of it is needed to *build*.
repository = "https://github.com/Artificial-Humanity/Lucida"
homepage = "https://github.com/Artificial-Humanity/Lucida"
readme = "README.md"

# Five is the crates.io maximum, so these are the searches worth being found in
# rather than a description of the tool.
keywords = ["image-generation", "video", "mcp", "gemini", "comfyui"]

# From crates.io's fixed list; an invented one is rejected at publish time.
categories = ["command-line-utilities", "multimedia::images", "multimedia::video"]

# A published crate is permanent, so what ships in it is worth stating rather
# than inheriting from whatever happens to be tracked.
#
# `video.mp4` is a 4.9 MB test render committed by accident in `d37737c` — it has
# nothing to do with building Lucida, and a tenth of the package would have been
# a video of fog. The notes are this project's internal working documents:
# CHANGELOG earns its place in a package, a product review does not.
exclude = [
    "video.mp4",
    "notes/product-review-*.md",
    "notes/code-review-*.md",
    "notes/release-downloads-*.md",
    "notes/STATE.md",
]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Terminal echo suppression for `config --set`. A dependency rather than a few
# lines of `stty -echo`, because the failure mode of hand-rolling it is leaving
# the user's terminal permanently echo-off when the process is interrupted
# mid-paste — restoring on a signal is the whole difficulty, and this crate
# already handles it on Unix and Windows. libc was in the tree already.
rpassword = "7"

# rustls rather than native-tls: keeps the binary free of a system OpenSSL
# dependency, so the same source cross-compiles cleanly to the Mac.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    # ComfyUI takes an image to edit over /upload/image, which is
    # multipart/form-data and has no JSON equivalent.
    "multipart",
    "rustls-tls",
] }
libc = "0.2.189"

# Verifying the checksum published alongside each release binary, for
# `lucida update`. A dependency rather than a hand-rolled SHA-256: the function
# is well specified and easy to test, but hand-rolled hashing is the kind of
# thing a reader has to audit rather than trust, and this one is already
# audited. RustCrypto, MIT/Apache-2.0, no runtime.
sha2 = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
