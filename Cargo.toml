[package]
name = "lucida"
version = "0.9.2"
edition = "2024"
# Edition 2024 needs 1.85. Stated so cargo refuses with "requires rustc 1.85 or
# newer" rather than handing an older toolchain a wall of syntax errors — which
# is what `cargo install --git`, the update path for anyone who did not take a
# release binary, does today.
rust-version = "1.85"
description = "Generate images and video with Google Gemini, Veo, a local ComfyUI, FLUX, Stability AI or OpenAI — a CLI and an MCP server"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Terminal echo suppression for `config --set`. A dependency rather than a few
# lines of `stty -echo`, because the failure mode of hand-rolling it is leaving
# the user's terminal permanently echo-off when the process is interrupted
# mid-paste — restoring on a signal is the whole difficulty, and this crate
# already handles it on Unix and Windows. libc was in the tree already.
rpassword = "7"

# rustls rather than native-tls: keeps the binary free of a system OpenSSL
# dependency, so the same source cross-compiles cleanly to the Mac.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    # ComfyUI takes an image to edit over /upload/image, which is
    # multipart/form-data and has no JSON equivalent.
    "multipart",
    "rustls-tls",
] }
libc = "0.2.189"

# Verifying the checksum published alongside each release binary, for
# `lucida update`. A dependency rather than a hand-rolled SHA-256: the function
# is well specified and easy to test, but hand-rolled hashing is the kind of
# thing a reader has to audit rather than trust, and this one is already
# audited. RustCrypto, MIT/Apache-2.0, no runtime.
sha2 = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
